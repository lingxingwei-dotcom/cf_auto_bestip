name: Cloudflare IP 自动同步

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *' # 每小时的 15 分运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install axios
        run: npm install axios 

      - name: Run sync script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          DOMAINS="hk.stellanling.top uswest.stellanling.top defd.stellanling.top moonsg.stellanling.top"
          for domain in $DOMAINS; do
            echo "正在为 $domain 更新优选 IP..."
            CF_DOMAIN=$domain node cf_dns_sync.js
          done

      - name: Send TG Notification
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=☁️ GitHub 云端同步完成%0A状态: ${{ job.status }}%0A时间: $(date '+%Y-%m-%d %H:%M')%0A域名: hk, uswest, defd, moonsg"
