name: Cloudflare IP 自动同步

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    # 每小时的第 15 分钟自动运行 (避开整点高峰)
    - cron: '15 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install axios
        run: npm install axios 

      - name: Run sync script for all domains
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          # 这里是你那 4 个需要同步的子域名
          DOMAINS="hk.stellanling.top uswest.stellanling.top defd.stellanling.top moonsg.stellanling.top"
          
          for domain in $DOMAINS; do
            echo "-------------------------------------"
            echo "正在为 $domain 更新优选 IP..."
            CF_DOMAIN=$domain node cf_dns_sync.js
          done
