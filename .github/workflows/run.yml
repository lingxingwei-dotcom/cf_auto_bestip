name: Cloudflare IP 自动同步

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '0 1,13 * * *' # 北京时间 9:00 和 21:00 自动运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install axios
        run: npm install axios 

      - name: Run sync script for all domains
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          # 👇 这里的 DOMAINS 已经包含了你截图里的四个域名
          DOMAINS="hk.stellanling.top uswest.stellanling.top defd.stellanling.top moonsg.stellanling.top"
          
          for domain in $DOMAINS; do
            echo "-------------------------------------"
            echo "正在为 $domain 更新优选 IP..."
            CF_DOMAIN=$domain node cf_dns_sync.js
          done
